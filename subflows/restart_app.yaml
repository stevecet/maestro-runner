# subflows/restart_app.yaml
# Restart flow permitting to launch app when authenticated. Neccessary on all 
# except login flows
appId: com.smobilpayagentapp
---
- runScript: ../data/config.js
- runScript: ../data/login/user.js
- stopApp: "com.smobilpayagentapp"
- launchApp: "com.smobilpayagentapp"
- tapOn:
    id: "LoginFormPassword"
- inputText: ${output.users.validUser.password}
- hideKeyboard
- tapOn:
    id: "LoginFormLogin"
- extendedWaitUntil:
    visible: "View all Services"
    timeout: ${output.config.veryLongTimeout}
