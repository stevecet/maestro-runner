# subflows/auth.yaml
# Initial flow of the app to be ran one fresh install
appId: com.smobilpayagentapp
---
- runScript: ../data/config.js
- launchApp:
    clearState: true
- tapOn:
    id: "GetStartedButton"
- tapOn:
    text: "Continue"
    optional: true
- repeat:
    times: 3
    commands:
      - tapOn:
          text: "Next"
          optional: true
- tapOn: 
    text: "Secure My Profile"
    optional: true
- extendedWaitUntil:
    visible: "Login"
    timeout: ${output.config.shortTimeout}
- tapOn:
    id: "LoginFormUsername"
- inputText: ${username}
- hideKeyboard
- tapOn:
    id: "LoginFormPassword"
- inputText: ${password}
- hideKeyboard
- tapOn:
    id: "LoginFormLogin"
