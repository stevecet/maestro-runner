# Verify as a Smobilpay Agent, I can add a comment to a ticket successfully
appId: com.smobilpayagentapp
onFlowStart:
  - runFlow: ../../subflows/restart_app.yaml
---
- runScript: ../../data/tickets_data.js
# Temporary action as the more button have no accesibility tag
- tapOn:
    point: "88%,96%"
- tapOn:
    id: "AppMenuItem-ListTickets"
- extendedWaitUntil:
    visible:
      point: "50%,30%"
    timeout: ${output.config.longTimeout}
## Tap on the first ticket
- tapOn:
    point: "50%,30%"
- tapOn:
    id: "AddCommentTextInput"
- inputText: ${output.strings.comment}
- tapOn:
    id: "SendCommentButton"
- scroll
- scroll
- assertVisible: ${output.strings.comment}
