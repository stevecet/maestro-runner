## Verify as a Smobilpay Agent, I can do a cashout via MTN successfully
appId: com.smobilpayagentapp
onFlowStart:
  - runFlow: ../../subflows/restart_app.yaml
---
- runScript: ../../data/cashout_data.js
- runFlow:
    file: ../../subflows/search_service.yaml
    env:
      searchValue: ${output.cashout_data.searchMTNCashout}
      serviceId: "ServiceItem-MTN MoMo Cash Out / RETRAIT"
- runFlow:
    file: ../../subflows/fill_transaction_form.yaml
    env:
      serviceNumber: ${output.cashout_data.mtnServiceNumber}
      amount: ${output.cashout_data.cashoutAmount}
- extendedWaitUntil:
    visible: ${output.cashout_data.transactionDetails}
    timeout: ${output.config.shortTimeout}
- scroll
## assert if the amount and the total are equal
- assertVisible:
    text: "${output.cashout_data.displayedAmount} XAF"
- assertVisible:
    text: "${output.cashout_data.serviceCharge} XAF"
- assertVisible:
    text: "${output.cashout_data.mtnTotalAmount} XAF"
- runFlow: ../../subflows/confirm_transaction.yaml
## assert successful transaction
