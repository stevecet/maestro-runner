services:
  android-emulator:
    container_name: android-emulator
    image: budtmo/docker-android:emulator_14.0
    privileged: true
    ports:
      - "6080:6080"
      - "5554:5554"
      - "5555:5555"
    environment:
      EMULATOR_DEVICE: "Samsung Galaxy S10"
      WEB_VNC: "true"
      APPIUM: "false"
      EMULATOR_TIMEOUT: "900"
      RELAXED_SECURITY: "true"
      EMULATOR_ARGS: "-gpu software -no-snapshot -noaudio -no-boot-anim" 
    shm_size: 6gb
    healthcheck:
      test: ["CMD-SHELL", "adb devices | grep -q 'device$'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 45s 
  maestro-runner:
    build: .
    image: steveceto/maestro-runner:latest
    container_name: maestro-tester
    command: /app/run_tests.sh
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      - APK_PATH=/app/app/smobilpay.apk
      - APK_URL=${APK_URL:-https://expo.dev/artifacts/eas/a_SbXg_Oq_iLv9mZFdCKroUcMq23onlkT4A-uGL3wrM.apk}
      - TEST_SUITE=${TEST_SUITE:-regression}
      - TEST_PATH=${TEST_PATH:-}
      - APP_PACKAGE=${APP_PACKAGE:-com.smobilpayagentapp}
      - DEVICE=${DEVICE:-android-emulator:5555}
      - INSTALL_ONLY=${INSTALL_ONLY:-0}
      - HOME=/tmp
      - ANDROID_SDK_HOME=/tmp
      - MAESTRO_CLI_NO_ANALYTICS=1
      - MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED=true
      - JAVA_TOOL_OPTIONS=-Duser.home=/tmp
    volumes:
      - .:/app:ro
      - ./app:/app/app
      - ./junit-results:/tmp/maestro-results/junit-results
      - ./allure-results:/tmp/maestro-results/allure-results
    depends_on:
      android-emulator:
        condition: service_healthy
      mockserver:
        condition: service_started

  mockserver:
    image: mockserver/mockserver:latest
    container_name: mockserver
    ports:
      - "1080:1080"
    environment:
      MOCKSERVER_LIVENESS_HTTP_GET_PATH: "/mockserver/status"
    volumes:
      - ./mockserver:/config
    command:
      - "-p"
      - "1080"
      - "--init"
      - "/config/initializer.json"
